name: Contact form to Telegram

# Запускається не по push, а коли форма на сайті викликає GitHub API
# (POST /repos/OWNER/REPO/dispatches з event_type: contact_form).
# TELEGRAM_BOT_TOKEN і TELEGRAM_CHAT_ID беруться з Settings → Secrets and
# variables → Actions і ніколи не потрапляють у код чи логи.
on:
  repository_dispatch:
    types: [contact_form]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAME: ${{ github.event.client_payload.name }}
          CONTACT: ${{ github.event.client_payload.contact }}
          SERVICE: ${{ github.event.client_payload.service }}
          MESSAGE: ${{ github.event.client_payload.message }}
        run: |
          TEXT="🆕 Нова заявка з сайту

Ім'я: ${NAME}
Контакт: ${CONTACT}
Послуга: ${SERVICE}
Повідомлення: ${MESSAGE}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
